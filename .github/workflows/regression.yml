name: Regression Tests

on:
  # push:
  #   branches:
  #     - main
  #     - test
  #   paths:
  #     - '**.apk'      # trigger when a new APK is committed
  #     - 'tests/**'    # or when test files change
  #     - 'pages/**'
  #     - 'wdio.conf.ts'

  workflow_dispatch:
    inputs:
      test_files:
        description: 'Test names: comma-separated (e.g. login,flight-cart)'
        required: false
        default: ''
      module:
        description: 'Module to run (e.g. auth, flight, expense). Leave empty to use test_files'
        required: false
        default: ''
      extra_env:
        description: 'Extra env vars for the test run, comma-separated KEY=VALUE (e.g. TRIP_TYPE=ROUNDTRIP,ROLE=ADMIN)'
        required: false
        default: ''
      stop_vm_after:
        description: 'Stop VM after tests?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  # Job 1: Start the GCP VM
  start-vm:
    name: Start GCP VM
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Check VM status
        id: vm_status
        run: |
          STATUS=$(gcloud compute instances describe reg-test-emulator \
            --zone=us-central1-a \
            --project=env-test-trotcat \
            --format='get(status)')
          echo "Current VM status: $STATUS"
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Start VM instance
        if: steps.vm_status.outputs.status != 'RUNNING'
        run: |
          gcloud compute instances start reg-test-emulator \
            --zone=us-central1-a \
            --project=env-test-trotcat

      - name: Wait for runner to come online
        if: steps.vm_status.outputs.status != 'RUNNING'
        run: sleep 30

  # Job 2: Run the regression tests
  run-tests:
    name: Run Appium Regression Tests
    needs: start-vm
    runs-on: self-hosted   
    timeout-minutes: 360

    env:
      DISPLAY: :1
      ANDROID_HOME: /home/faris_faruk/Android/sdk
      ANDROID_BUILD_TOOLS_VERSION: 35.0.0

    steps:
      - name: Record session start time
        run: echo "SESSION_START=$(date +%s)" >> $GITHUB_ENV
        
      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Set up Node 20 via nvm
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 20
          echo "$(nvm which 20 | xargs dirname)" >> $GITHUB_PATH

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Download APK from GCS
        run: |
          gcloud storage cp gs://trotcat-ci-artifacts/latest/app.apk \
            /home/faris_faruk/Downloads/app.apk \
            --project=trotcat-cicd
      
      - name: Start Xvfb virtual display
        run: |
          Xvfb :1 -screen 0 1024x768x16 &
          sleep 2
          echo "Xvfb started on display :1"

      - name: Start resource monitor
        run: |
          (
            while true; do
              echo "===== $(date -u +%FT%TZ) ====="
              free -m
              df -h /
              echo "--- top mem consumers ---"
              ps aux --sort=-%mem | head -10
              echo "--- top cpu consumers ---"
              ps aux --sort=-%cpu | head -10
              echo
              sleep 20
            done
          ) >> /tmp/resource-monitor.log 2>&1 &
          echo "MONITOR_PID=$!" >> $GITHUB_ENV

      - name: Boot Android emulator
        timeout-minutes: 6
        run: |
          export NVM_DIR="$HOME/.nvm" && \. "$NVM_DIR/nvm.sh"
          nohup $ANDROID_HOME/emulator/emulator \
            -avd tcat-test \
            -no-window \
            -no-audio \
            -snapshot clean-boot \
            -no-snapshot-save \
            -no-boot-anim \
            -memory 3072 \
            -cores 2 \
            -accel on \
            -gpu swangle_indirect \
            -no-metrics &

          echo "Waiting for emulator to boot..."
          $ANDROID_HOME/platform-tools/adb wait-for-device

          # Poll until boot completes (not just device connected)
          for i in $(seq 1 30); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then
              echo "Emulator boot complete."
              break
            fi
            echo "Still booting... ($i/30)"
            sleep 10
          done
          
          echo "Default IME: $(adb shell settings get secure default_input_method)"
          adb devices

      - name: Start Appium server
        timeout-minutes: 3
        run: |
          export NVM_DIR="$HOME/.nvm" && \. "$NVM_DIR/nvm.sh"
          nohup npx appium > /tmp/appium.log 2>&1 &
          sleep 5
          echo "Appium started. Log at /tmp/appium.log"
          # Quick health check
          curl -s http://127.0.0.1:4723/status | grep -q "ready" && echo "Appium ready." || echo "Appium may still be warming up."

      - name: Run regression tests
        timeout-minutes: 340
        id: test_run
        run: |
          set +e   # <-- don't let a single failing test kill the whole step

          export NVM_DIR="$HOME/.nvm" && \. "$NVM_DIR/nvm.sh"

          PER_TEST_TIMEOUT_SEC=1200
          RESTART_EVERY=5

          if [ -n "${{ github.event.inputs.extra_env }}" ]; then
            IFS=',' read -ra ENV_PAIRS <<< "${{ github.event.inputs.extra_env }}"
            for pair in "${ENV_PAIRS[@]}"; do
              export "$(echo "$pair" | xargs)"
            done
          fi

          SPECS=()
          if [ -n "${{ github.event.inputs.module }}" ]; then
            while IFS= read -r f; do SPECS+=("$f"); done < <(find "tests/${{ github.event.inputs.module }}" -name '*.spec.ts' | sort)
          elif [ -n "${{ github.event.inputs.test_files }}" ]; then
            IFS=',' read -ra NAMES <<< "${{ github.event.inputs.test_files }}"
            for name in "${NAMES[@]}"; do
              n=$(echo "$name" | xargs)
              [[ "$n" != tests/* ]] && n="tests/$n"
              [[ "$n" != *.spec.ts ]] && n="${n}.spec.ts"
              SPECS+=("$n")
            done
          else
            while IFS= read -r f; do SPECS+=("$f"); done < <(find tests -name '*.spec.ts' | sort)
          fi

          echo "Running ${#SPECS[@]} spec(s)"
          echo "| Spec | Result | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY

          i=0
          for spec in "${SPECS[@]}"; do
            i=$((i+1))
            START=$(date +%s)

            timeout "$PER_TEST_TIMEOUT_SEC" npx mocha \
              --require ts-node/register \
              --require tsconfig-paths/register \
              --timeout 600000 \
              --reporter mocha-allure-reporter \
              "$spec"
            RC=$?

            END=$(date +%s)
            DUR=$(( (END - START) / 60 ))
            NAME=$(basename "$spec" .spec.ts)

            if [ $RC -eq 0 ]; then
              echo "| $NAME | ✅ Pass | ${DUR}m |" >> $GITHUB_STEP_SUMMARY
            elif [ $RC -eq 124 ]; then
              echo "| $NAME | ⏱️ Timed out | ${DUR}m |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $NAME | ❌ Failed | ${DUR}m |" >> $GITHUB_STEP_SUMMARY
            fi

            if [ $((i % RESTART_EVERY)) -eq 0 ] && [ $i -lt ${#SPECS[@]} ]; then
              echo "Recycling Appium + emulator after $i specs..."
              pkill -f appium || true
              adb emu kill || true
              sleep 3
              nohup $ANDROID_HOME/emulator/emulator -avd tcat-test -no-window -no-audio \
                -snapshot clean-boot -no-snapshot-save -no-boot-anim -memory 3072 -cores 2 \
                -accel on -gpu swangle_indirect -no-metrics &
              adb wait-for-device
              for j in $(seq 1 30); do
                BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
                [ "$BOOT" = "1" ] && break
                sleep 10
              done
              nohup npx appium > /tmp/appium.log 2>&1 &
              sleep 5
            fi
          done

          # Fail the step overall if anything failed, so GH still shows red/yellow,
          # but only AFTER every spec has had a chance to run.
          if grep -q "❌\|⏱️" $GITHUB_STEP_SUMMARY; then
            echo "One or more specs failed or timed out — see summary above."
            exit 1
          fi
          
      - name: Generate Allure report
        if: always()   # generate even if tests failed
        run: |
          export NVM_DIR="$HOME/.nvm" && \. "$NVM_DIR/nvm.sh"
          rm -rf allure-report
          npx allure generate allure-results -o allure-report

      - name: Upload Allure report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.sha }}
          path: allure-report/
          retention-days: 14
        # Download the report from the GitHub Actions run page.

      - name: Upload Appium log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log-${{ github.sha }}
          path: /tmp/appium.log

      # - name: Publish APK on success
      #  if: success()
      #  run: |
      #    echo "Tests passed. Pushing APK."
          # Replace this block with your actual publish step.
          # Examples:
          #
          # Firebase App Distribution:
          # npx firebase appdistribution:distribute /home/faris_faruk/Downloads/app.apk \
          #   --app ${{ secrets.FIREBASE_APP_ID }} \
          #   --token ${{ secrets.FIREBASE_TOKEN }} \
          #   --groups testers
          #
          # Google Cloud Storage:
          # gsutil cp /home/faris_faruk/Downloads/app.apk gs://your-bucket/releases/${{ github.sha }}/app.apk
          #
          # GitHub Release:
          # gh release upload ${{ github.ref_name }} /home/faris_faruk/Downloads/app.apk
      #    echo "APK publish step: configure for your distribution channel."

      - name: Send success email
        if: success()
        run: |
          zip -r allure-report.zip allure-report/
          base64 -w 0 allure-report.zip > report_b64.txt
          TO_JSON=$(echo "${{ vars.NOTIFY_EMAILS }}" | tr ',' '\n' | tr -d ' ' | jq -Rn '[inputs | {email: .}]')
          BODY="<html><body>
          <h3>✅ Regression Passed</h3>
          <table>
            <tr><td><b>Commit</b></td><td>${{ github.sha }}</td></tr>
            <tr><td><b>Branch</b></td><td>${{ github.ref_name }}</td></tr>
            <tr><td><b>Triggered by</b></td><td>${{ github.actor }}</td></tr>
          </table>
          <p><a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View run on GitHub</a></p>
          </body></html>"
      
          jq -n \
            --arg from "${{ secrets.MAIL_USERNAME }}" \
            --argjson to "$TO_JSON" \
            --arg subject "Regression Passed — ${{ github.repository }} @ ${{ github.ref_name }}" \
            --arg body "$BODY" \
            --rawfile report report_b64.txt \
            '{
              from: {email: $from},
              personalizations: [{to: $to, subject: $subject}],
              subject: $subject,
              content: [{type: "text/html", value: $body}],
              attachments: [{content: $report, type: "application/zip", filename: "allure-report.zip"}]
            }' > payload.json
      
          curl -s -f --show-error --request POST \
            --url https://api.sendgrid.com/v3/mail/send \
            --header "Authorization: Bearer ${{ secrets.SENDGRID_API_KEY }}" \
            --header "Content-Type: application/json" \
            --data @payload.json \
            && echo "SendGrid: OK" || echo "SendGrid: FAILED"

      - name: Send failure email
        if: failure()
        run: |
          zip -r allure-report.zip allure-report/ 2>/dev/null || true
          base64 -w 0 allure-report.zip > report_b64.txt 2>/dev/null || echo -n "" > report_b64.txt
          base64 -w 0 /tmp/appium.log > appium_b64.txt 2>/dev/null || echo -n "" > appium_b64.txt
          TO_JSON=$(echo "${{ vars.NOTIFY_EMAILS }}" | tr ',' '\n' | tr -d ' ' | jq -Rn '[inputs | {email: .}]')
          BODY="<html><body>
          <h3>❌ Regression Failed</h3>
          <table>
            <tr><td><b>Commit</b></td><td>${{ github.sha }}</td></tr>
            <tr><td><b>Branch</b></td><td>${{ github.ref_name }}</td></tr>
            <tr><td><b>Triggered by</b></td><td>${{ github.actor }}</td></tr>
          </table>
          <p><a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View run on GitHub</a></p>
          </body></html>"
      
          jq -n \
            --arg from "${{ secrets.MAIL_USERNAME }}" \
            --argjson to "$TO_JSON" \
            --arg subject "Regression Failed — ${{ github.repository }} @ ${{ github.ref_name }}" \
            --arg body "$BODY" \
            --rawfile report report_b64.txt \
            --rawfile appium appium_b64.txt \
            '{
              from: {email: $from},
              personalizations: [{to: $to, subject: $subject}],
              subject: $subject,
              content: [{type: "text/html", value: $body}],
              attachments: [
                {content: $report, type: "application/zip", filename: "allure-report.zip"},
                {content: $appium, type: "text/plain", filename: "appium.log"}
              ]
            }' > payload.json
      
          curl -s -f --show-error --request POST \
            --url https://api.sendgrid.com/v3/mail/send \
            --header "Authorization: Bearer ${{ secrets.SENDGRID_API_KEY }}" \
            --header "Content-Type: application/json" \
            --data @payload.json \
            && echo "SendGrid: OK" || echo "SendGrid: FAILED"

      - name: Cleanup — kill emulator and Appium
        if: always()
        run: |
          kill $MONITOR_PID 2>/dev/null || true
          adb shell reboot -p
          sleep 5
          adb emu kill || true
          pkill -f appium || true
          pkill -f Xvfb || true
          echo "Cleanup done."

      - name: Upload resource monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-monitor-${{ github.sha }}
          path: /tmp/resource-monitor.log
          
      - name: Log session cost
        if: always()
        run: |
          END=$(date +%s)
          DURATION_SECS=$((END - SESSION_START))
          DURATION_MINS=$(echo "scale=2; $DURATION_SECS / 60" | bc)
          
          # n2-standard-2 on-demand: ~$0.0971/hr = ~$0.001618/min
          COST=$(echo "scale=4; $DURATION_MINS * 0.001618" | bc)
          
          echo "## Session Cost Estimate" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| VM runtime | ${DURATION_MINS} minutes (${DURATION_SECS}s) |" >> $GITHUB_STEP_SUMMARY
          echo "| Estimated GCP cost | \$$COST USD |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

  #Job 3: Stop the GCP VM
  stop-vm:
    name: Stop GCP VM
    needs: run-tests
    runs-on: ubuntu-latest
    if: always() && github.event.inputs.stop_vm_after == 'true'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Stop VM instance
        run: |
          gcloud compute instances stop reg-test-emulator \
            --zone=us-central1-a \
            --project=env-test-trotcat
          echo "VM stopped."
